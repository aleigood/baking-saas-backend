# docker-compose.yml
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PAYMENT_PROVIDER: wechat
    ports:
      - '9527:9527'
    depends_on:
      - db

  db:
    image: docker.1ms.run/postgres:15
    restart: always
    environment:
      POSTGRES_USER: aleigood
      POSTGRES_PASSWORD: Hulei1234
      POSTGRES_DB: baking-saas
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
