# docker-compose.yml
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
    ports:
      - '127.0.0.1:9527:9527'
    depends_on:
      - db

  db:
    image: docker.1ms.run/postgres:15
    restart: always
    env_file:
      - .env.production
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
